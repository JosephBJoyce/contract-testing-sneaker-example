name: Consumer - Sneaker Studio Web

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'consumers/sneaker-studio-web/**'
      - '.github/workflows/consumer-sneaker-studio.yml'
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumers/sneaker-studio-web

    env:
      PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: consumers/sneaker-studio-web/package.json

      - name: Install dependencies
        run: npm install

      - name: Run Pact consumer tests
        run: npm test

      - name: Publish pacts to PactFlow
        run: |
          docker run --rm \
            -v "${PWD}/pacts:/pacts" \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_TOKEN \
            pactfoundation/pact-cli:latest \
            pact-broker publish /pacts \
              --consumer-app-version "${{ github.sha }}" \
              --branch "${{ github.ref_name }}"

      - name: Can I deploy?
        run: |
          docker run --rm \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_TOKEN \
            pactfoundation/pact-cli:latest \
            pact-broker can-i-deploy \
              --pacticipant sneaker-studio-web \
              --version "${{ github.sha }}" \
              --to-environment production

      - name: Record deployment to production
        if: github.ref_name == 'main'
        run: |
          docker run --rm \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_TOKEN \
            pactfoundation/pact-cli:latest \
            pact-broker record-deployment \
              --pacticipant sneaker-studio-web \
              --version "${{ github.sha }}" \
              --environment production
